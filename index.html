<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23277a">
<title>Stok Rak</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eaf5ef;--card:#fff;--ink:#16182b;--mut:#5b6670;--pri:#23277a;--on:#fff;--ok:#2f9a1c;--line:#bfd0c7;--hot:#d81b73;--gray:#d5ddd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--card:#17241e;--ink:#e6efea;--mut:#9fb0a8;--pri:#3a3fb0;--line:#2c3f36;--gray:#2a3a33}}
:root[data-theme="dark"]{--bg:#0f1a15;--card:#17241e;--ink:#e6efea;--mut:#9fb0a8;--pri:#3a3fb0;--line:#2c3f36;--gray:#2a3a33}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 "Roboto",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:var(--bg)}
header{background:var(--pri);color:var(--on);display:flex;align-items:center;gap:8px;padding:14px 12px;font-size:21px;font-weight:700;flex:none}
header h1{margin:0;font-size:inherit;flex:1;text-align:center}
header button{background:none;border:0;color:inherit;font-size:28px;width:40px;height:40px;cursor:pointer}
header button[hidden]{display:block;visibility:hidden}
main{flex:1;min-height:0;display:flex;flex-direction:column}
section[hidden]{display:none}
section{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:26px 14px;font:inherit;font-size:20px;color:var(--ink);cursor:pointer}
.menu button:active{background:var(--gray)}
label{display:block;margin:16px 0 2px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:flex-end}
.fld{flex:1;display:flex;align-items:center;border-bottom:2px solid var(--line)}
.fld:focus-within{border-color:var(--hot)}
.fld input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:20px;padding:10px 4px}
.fld input::placeholder{color:var(--mut);opacity:.7}
.cam{background:none;border:0;color:var(--mut);padding:8px;cursor:pointer;display:flex}
.cam svg{width:26px;height:26px}
.go{flex:none;width:56px;height:56px;border:0;border-radius:4px;background:var(--gray);color:var(--ink);font-size:26px;cursor:pointer}
.go:active{background:var(--line)}
.list{flex:1;min-height:0;overflow-y:auto;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:14px 0}
.item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.item b{flex:1;overflow-wrap:anywhere;font-weight:500}
.item .q{font-weight:700;min-width:3ch;text-align:right}
.item button{background:none;border:0;color:var(--mut);font-size:22px;padding:4px 8px;cursor:pointer}
.sum{color:var(--mut);font-size:15px;margin-top:6px}
.foot{flex:none;display:flex;flex-wrap:wrap;gap:10px;padding:10px 0 14px}
.foot button{flex:1;border:0;border-radius:3px;padding:16px 8px;font:inherit;font-weight:700;letter-spacing:.02em;cursor:pointer}
.clr{background:var(--gray);color:var(--ink)}
.up{background:var(--ok);color:#fff}
.foot .txt{flex:1 1 100%;background:var(--pri);color:#fff}
.sh{margin:0 0 0;font-size:15px;color:var(--mut);padding-top:14px}
#cam,#out{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#cam[hidden],#out[hidden]{display:none}
#vid{width:100%;max-width:520px;max-height:60%;background:#000;border-radius:6px}
#cam p{color:#fff;margin:0;text-align:center}
#cam label[hidden]{display:none}
#cam button,#cam label,#out button{background:#fff;color:#111;border:0;border-radius:4px;padding:14px 26px;font:inherit;font-weight:700;cursor:pointer}
#out textarea{width:100%;max-width:520px;height:38%;font:14px/1.4 ui-monospace,Menlo,monospace;background:var(--card);color:var(--ink);border:0;border-radius:4px;padding:10px}
#out p{color:#fff;margin:0;max-width:520px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#cam{display:block;padding:0;background:#000;overflow:hidden}
#cam #vid{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;border-radius:0;background:#000}
#cam #vid[hidden]{display:none}
#cam #vid{opacity:0;transition:opacity .18s}
#cam #vid.ready{opacity:1}
#pv{position:absolute;left:0;top:0;width:100%;height:100%;display:none;background:#000}
#cam.ios #pv{display:block}
#cam.ios #vid,#cam.ios #vid.ready{position:absolute!important;left:0!important;top:0!important;inset:auto!important;width:8px!important;height:8px!important;max-width:none!important;opacity:.02!important;transform:none!important;pointer-events:none}
#frame{position:absolute;left:6%;right:6%;top:34%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.4);pointer-events:none}
#frame[hidden]{display:none}
#cam #cam-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:48px;height:48px;padding:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:26px;line-height:1;z-index:2}
#cam #cam-p{position:absolute;left:14px;right:14px;bottom:calc(30px + env(safe-area-inset-bottom,0px));color:#fff;text-shadow:0 1px 5px #000;z-index:2}
#cam #shot{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:2}
#cam-tools{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:2}
#cam-tools button{min-width:56px;height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(0,0,0,.6);color:#fff;font:inherit;font-weight:700;font-size:16px}
#cam-tools button.on{background:#fff;color:#111}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stok Rak">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="app">
<header><button id="back" hidden aria-label="Kembali">‹</button><h1 id="title">Menu</h1><button id="gear" aria-label="Pengaturan"></button></header>
<main>
<section id="menu" class="menu">
<button data-go="stock">1. STOCK TAKE SHELF</button>
<button data-go="rec">2. SHELF RECORD</button>
</section>

<section id="stock" hidden>
<label for="s-shelf">Shelf :</label>
<div class="fld"><input id="s-shelf" autocomplete="off" autocapitalize="characters" placeholder="Ex : AG05-01"><button class="cam" data-cam="s-shelf" aria-label="Scan shelf dengan kamera"></button></div>
<label for="s-code">Scan Code :</label>
<div class="fld"><input id="s-code" inputmode="numeric" autocomplete="off" placeholder="Ex : 123456"><button class="cam" data-cam="s-code" aria-label="Scan SKU dengan kamera"></button></div>
<label for="s-qty">Qty:</label>
<div class="row"><div class="fld"><input id="s-qty" inputmode="numeric" autocomplete="off" placeholder="Ex : 99"></div><button class="go" id="s-add" aria-label="Tambah">↵</button></div>
<div class="sum" id="s-sum"></div>
<div class="list" id="s-list"></div>
<div class="foot"><button class="txt" id="s-txt">BAGIKAN FILE TXT</button><button class="clr" id="s-clear">CLEAR ALL</button><button class="up" id="s-up">UPLOAD TO PC</button></div>
</section>

<section id="rec" hidden>
<p class="sh">ENTER SHELF CODE</p>
<label for="r-shelf" style="margin-top:4px">Shelf :</label>
<div class="fld"><input id="r-shelf" autocomplete="off" autocapitalize="characters" placeholder="Ex : AG05-01"><button class="cam" data-cam="r-shelf" aria-label="Scan shelf dengan kamera"></button></div>
<label for="r-code">Barcode :</label>
<div class="row"><div class="fld"><input id="r-code" inputmode="numeric" autocomplete="off" placeholder="Ex : 123456"><button class="cam" data-cam="r-code" aria-label="Scan barcode dengan kamera"></button></div><button class="go" id="r-add" aria-label="Tambah">↵</button></div>
<div class="sum" id="r-sum"></div>
<div class="list" id="r-list"></div>
<div class="foot"><button class="txt" id="r-txt">BAGIKAN FILE TXT</button><button class="clr" id="r-clear">CLEAR ALL</button><button class="up" id="r-up">UPLOAD TO PC</button></div>
</section>

<section id="set" hidden>
<label for="st-name">Nama (ID perangkat) :</label>
<div class="fld"><input id="st-name" autocomplete="off" autocapitalize="characters" placeholder="Ex : GK4006"></div>
<p class="sum">Nama ini ditambahkan di awal nama file TXT. Isi file hanya berisi hasil scan.</p>
<div style="flex:1"></div>
<div class="foot"><button class="up" id="st-save">SIMPAN</button></div>
</section>
</main>
</div>

<div id="cam" hidden><video id="vid" playsinline muted></video><canvas id="pv"></canvas><div id="frame"></div><button id="cam-x" aria-label="Tutup kamera">✕</button><p id="cam-p">Arahkan kamera ke barcode</p><div id="cam-tools"></div></div>
<div id="out" hidden><p>Salin data ini (dipisah koma) lalu tempel di komputer, atau ketuk Bagikan untuk mengirimnya sebagai file TXT.</p><textarea id="out-t" readonly></textarea><button id="out-c">Salin</button><button id="out-s">Bagikan</button><button id="out-x">Tutup</button></div>
<input id="shot-in" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const ICON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>';
document.querySelectorAll('.cam').forEach(b=>b.innerHTML=ICON);

let S={stock:{shelf:'',items:[]},rec:{shelf:'',items:[]}};
try{const r=localStorage.getItem('stokrak1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.cfg)S.cfg={name:''};
const save=()=>{try{localStorage.setItem('stokrak1',JSON.stringify(S))}catch(e){}};

let tt;
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms||2200)}

const TITLES={menu:'Menu',stock:'Stock Take Shelf',rec:'Shelf Record',set:'Pengaturan'};
function show(v){
  ['menu','stock','rec','set'].forEach(x=>$('#'+x).hidden=x!==v);
  $('#title').textContent=TITLES[v];$('#back').hidden=v==='menu';$('#gear').hidden=v!=='menu';if(v==='set')$('#st-name').value=S.cfg.name||'';
  if(v==='stock'){$('#s-shelf').value=S.stock.shelf;render('stock')}
  if(v==='rec'){$('#r-shelf').value=S.rec.shelf;render('rec')}
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#back').onclick=()=>show('menu');
const GEAR='<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>';
$('#gear').innerHTML=GEAR;$('#gear').onclick=()=>show('set');
$('#st-name').oninput=e=>{const v=e.target.value.replace(/[\s,]/g,'').toUpperCase();if(v!==e.target.value)e.target.value=v;S.cfg.name=v;save()};
$('#st-save').onclick=()=>{toast(S.cfg.name?'Tersimpan: '+S.cfg.name:'Nama dikosongkan');show('menu')};

function render(k){
  const p=k==='stock'?'s':'r',list=$('#'+p+'-list'),items=S[k].items;
  list.textContent='';
  if(!items.length){const d=document.createElement('div');d.className='empty';d.textContent='Belum ada data. Scan barang untuk memulai.';list.appendChild(d)}
  items.forEach((it,i)=>{
    const row=document.createElement('div');row.className='item';
    const c=document.createElement('b');c.textContent=k==='rec'?(items.length-i)+': [ '+(it.shelf||S.rec.shelf)+' ] '+it.code:(items.length-i)+': '+it.code+': [ QTY :'+it.qty+'] <'+(it.shelf||S.stock.shelf)+'>';row.appendChild(c);
    
    const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Hapus');
    x.onclick=()=>{items.splice(i,1);save();render(k)};row.appendChild(x);list.appendChild(row);
  });
  const total=k==='stock'?items.reduce((a,b)=>a+b.qty,0):0;
  $('#'+p+'-sum').textContent=k==='stock'?items.length+' SKU, total qty '+total:items.length+' barcode tercatat';
}

/* Stock Take Shelf */
$('#s-shelf').oninput=e=>{S.stock.shelf=e.target.value.trim().toUpperCase();save()};
function addStock(){
  const shelf=$('#s-shelf').value.trim().toUpperCase(),code=$('#s-code').value.trim(),qty=parseInt($('#s-qty').value,10);
  if(!shelf){toast('Isi kode shelf dulu');$('#s-shelf').focus();return}
  if(!code){toast('Isi atau scan kode SKU');$('#s-code').focus();return}
  if(!(qty>0)){toast('Isi qty dengan angka');$('#s-qty').focus();return}
  S.stock.shelf=shelf;
  const f=S.stock.items.find(i=>i.code===code&&(i.shelf||shelf)===shelf);
  if(f)f.qty+=qty;else S.stock.items.unshift({shelf,code,qty});
  save();render('stock');$('#s-code').value='';$('#s-qty').value='';$('#s-code').focus();
}
$('#s-add').onclick=addStock;
$('#s-code').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#s-qty').focus()}};
$('#s-qty').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addStock()}};

/* Shelf Record */
$('#r-shelf').oninput=e=>{S.rec.shelf=e.target.value.trim().toUpperCase();save()};
function addRec(){
  const shelf=$('#r-shelf').value.trim().toUpperCase(),code=$('#r-code').value.trim();
  if(!shelf){toast('Isi kode shelf dulu');$('#r-shelf').focus();return}
  if(!code){toast('Isi atau scan barcode');$('#r-code').focus();return}
  S.rec.shelf=shelf;
  S.rec.items.unshift({shelf,code});
  save();render('rec');$('#r-code').value='';$('#r-code').focus();
}
$('#r-add').onclick=addRec;
$('#r-code').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addRec()}};
$('#r-shelf').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#r-code').focus()}};
$('#s-shelf').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#s-code').focus()}};

/* Hapus semua: ketuk dua kali */
function armClear(btn,k){
  let armed=false,t;
  btn.onclick=()=>{
    if(!armed){armed=true;btn.textContent='KETUK LAGI';t=setTimeout(()=>{armed=false;btn.textContent='CLEAR ALL'},3000);return}
    clearTimeout(t);armed=false;btn.textContent='CLEAR ALL';S[k].items=[];save();render(k);
  };
}
armClear($('#s-clear'),'stock');armClear($('#r-clear'),'rec');

/* Upload: bagikan file XLSX, atau salin teks */
async function upload(k){
  const d=S[k];
  if(!d.items.length){toast('Belum ada data');return}
  const rows=k==='stock'?[['rack','sku','qty'],...d.items.map(i=>[i.shelf||d.shelf,i.code,i.qty])]:[['rack','barcode'],...d.items.slice().reverse().map(i=>[i.shelf||d.shelf,i.code])];
  const tsv=rows.slice(1).map(r=>r.join(',')).join('\n');
  const name=(k==='stock'?'stock-take-':'shelf-record-')+(d.shelf||'shelf')+'.xlsx';
  try{
    if(!window.XLSX)throw new Error('xlsx');
    const price=c=>({t:'n',f:'IFERROR(INDEX(Harga!$C$2:$C$5000,MATCH('+c+'&"",INDEX(Harga!$A$2:$A$5000&"",0),0)),"")'});
    const list=k==='stock'?d.items.slice():d.items.slice().reverse();
    const aoa=[k==='stock'?['Rack','SKU','Qty','Harga','Total']:['No','Rack','Barcode','Harga']];
    list.forEach((it,i)=>{const R=i+2;
      if(k==='stock')aoa.push([it.shelf||d.shelf,String(it.code),it.qty,price('B'+R),{t:'n',f:'IF(D'+R+'="","",C'+R+'*D'+R+')'}]);
      else aoa.push([i+1,it.shelf||d.shelf,String(it.code),price('C'+R)]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:12},{wch:16},{wch:16},{wch:12},{wch:12}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Scan');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Barcode','Nama','Harga']]),'Harga');
    wb.Workbook={CalcPr:{fullCalcOnLoad:true}};
    const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    /* UPLOAD TO PC selalu menampilkan layar salin (sama di Android dan iOS) */
  }catch(e){if(e&&e.name==='AbortError')return}
  $('#out-t').dataset.name=name.replace('.xlsx','');$('#out-t').value=tsv;$('#out').hidden=false;
}
$('#s-up').onclick=()=>upload('stock');$('#r-up').onclick=()=>upload('rec');
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear()+'_'+p(d.getHours())+'-'+p(d.getMinutes())}
function headLine(){const n=S.cfg&&S.cfg.name;if(!n)return '';const d=new Date(),p=x=>String(x).padStart(2,'0');return n+','+p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear()+','+p(d.getHours())+':'+p(d.getMinutes())+'\n'}
function fname(){return (S.cfg&&S.cfg.name?S.cfg.name+'_':'')+stamp()+'.txt'}
function rowsOf(k){const d=S[k];return k==='stock'?[['rack','sku','qty'],...d.items.map(i=>[i.shelf||d.shelf,i.code,i.qty])]:[['rack','barcode'],...d.items.slice().reverse().map(i=>[i.shelf||d.shelf,i.code])]}
async function shareTxt(k){
  const d=S[k];if(!d.items.length){toast('Belum ada data');return}
  const t=rowsOf(k).slice(1).map(r=>r.join(',')).join('\n');
  const name=fname();
  try{const f=new File([t],name,{type:'text/plain'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}
    if(navigator.share){await navigator.share({title:name,text:t});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  toast('Menu bagikan tidak tersedia di sini. Buka dari aplikasi Netlify yang sudah di-install.',4500)
}
$('#s-txt').onclick=()=>shareTxt('stock');$('#r-txt').onclick=()=>shareTxt('rec');
$('#out-x').onclick=()=>$('#out').hidden=true;
$('#out-s').onclick=async()=>{const t=$('#out-t').value,name=fname();try{const f=new File([t],name,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}if(navigator.share){await navigator.share({title:'Stok Rak',text:t});return}}catch(e){if(e&&e.name==='AbortError')return}toast('Menu bagikan tidak tersedia di sini. Pakai aplikasi yang sudah di-install dari Netlify.',4500)};
$('#out-c').onclick=async()=>{
  const t=$('#out-t');t.select();

/* Kamera: pemindai Code 128 bawaan, ZXing dan BarcodeDetector sebagai cadangan */
let stream=null,tm=null,target=null,running=false;
const framed=(()=>{try{return window.self!==window.top}catch(_){return true}})();
const P128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function sym(w,a,lo,hi,n){
  if(a+n>w.length)return null;
  let s=0;for(let k=0;k<n;k++)s+=w[a+k];
  const u=s/(n===7?13:11);let best=-1,be=99;
  for(let v=lo;v<=hi;v++){const p=P128[v];let e=0;for(let k=0;k<n;k++)e+=Math.abs(w[a+k]/u-(+p[k]));if(e<be){be=e;best=v}}
  return [best,be];
}
function dec128(w,i0){
  const st=sym(w,i0,103,105,6);if(!st||st[1]>2.4)return null;
  const vals=[st[0]];let a=i0+6;
  for(let n=0;n<48;n++){
    const d=sym(w,a,0,105,6),sp=sym(w,a,106,106,7);
    if(sp&&sp[1]<2.6&&(!d||sp[1]<d[1])){
      if(vals.length<5)return null;
      const chk=vals[vals.length-1],body=vals.slice(0,-1);
      let sum=body[0];for(let i=1;i<body.length;i++)sum+=body[i]*i;
      if(sum%103!==chk)return null;
      let set=body[0]===103?'A':body[0]===104?'B':'C',out='';
      for(let i=1;i<body.length;i++){
        const v=body[i];
        if(set==='C'){if(v<100)out+=(v<10?'0':'')+v;else if(v===100)set='B';else if(v===101)set='A'}
        else{if(v<96)out+=(set==='A'&&v>=64)?String.fromCharCode(v-64):String.fromCharCode(32+v);else if(v===99)set='C';else if(v===100&&set==='A')set='B';else if(v===101&&set==='B')set='A'}
      }
      out=out.replace(/[\x00-\x1f]/g,'');return out.length>=3?out:null;
    }
    if(!d||d[1]>2.4)return null;
    vals.push(d[0]);a+=6;
  }
  return null;
}
function scanRows(g,W,H,y0,y1,step){
  const B=Math.max(48,Math.round(W/14));
  for(let y=y0;y<y1;y+=step){
    const o=y*W,nb=Math.ceil(W/B),thr=new Float32Array(nb);
    for(let b=0;b<nb;b++){let mn=255,mx=0;const xe=Math.min(W,(b+1)*B);for(let x=b*B;x<xe;x++){const v=g[o+x];if(v<mn)mn=v;if(v>mx)mx=v}
      thr[b]=(mx-mn>=45)?(mn+mx)/2:-1}
    let lt=-1;for(let b=0;b<nb;b++){if(thr[b]>=0)lt=thr[b];else if(lt>=0)thr[b]=lt}
    lt=-1;for(let b=nb-1;b>=0;b--){if(thr[b]>=0)lt=thr[b];else if(lt>=0)thr[b]=lt}
    const w=[];let cur=-1,len=0,first=0;
    for(let x=0;x<W;x++){
      const t=thr[(x/B)|0];const dark=t>=0&&g[o+x]<t?1:0;
      if(cur<0){cur=dark;len=1;first=dark}
      else if(dark===cur)len++;
      else{w.push(len);cur=dark;len=1}
    }
    w.push(len);
    if(w.length<10)continue;
    const rev=w.slice().reverse(),revFirst=((w.length-1)%2===0)?first:1-first;
    for(const [arr,f] of [[w,first],[rev,revFirst]]){
      for(let i=f?0:1;i+7<arr.length;i+=2){
        const r=dec128(arr,i);if(r)return r;
      }
    }
  }
  return null;
}

function grayOf(cx,x,y,w,h){const d=cx.getImageData(x,y,w,h).data,g=new Uint8Array(w*h);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;return g}
const zxFmt=()=>{const F=ZXing.BarcodeFormat;return [F.CODE_128,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_39,F.ITF,F.CODABAR]};
function zxCanvas(cv){
  if(!window.ZXing)return null;
  const h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,zxFmt());
  for(const B of [ZXing.HybridBinarizer,ZXing.GlobalHistogramBinarizer]){
    try{const r=new ZXing.MultiFormatReader();r.setHints(h);const bb=new ZXing.BinaryBitmap(new B(new ZXing.HTMLCanvasElementLuminanceSource(cv)));const res=r.decode(bb);zxCanvas.fmt=res.getBarcodeFormat();return res.getText()}catch(_){}
  }
  return null;
}
const nap=()=>new Promise(r=>setTimeout(r,0));
function clean(v){return String(v).replace(/[\x00-\x1f\x7f]/g,'').replace(/^\][A-Za-z][0-9A-Za-z]/,'').replace(/^C1(\d{7})$/,'$1').trim()}
function deliver(id,v){v=clean(v);
  const el=$('#'+id);el.value=v;el.dispatchEvent(new Event('input'));
  try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}
  if(id==='s-code')$('#s-qty').focus();else if(id==='r-code')addRec();else if(id==='s-shelf')$('#s-code').focus();else if(id==='r-shelf')$('#r-code').focus();
}
const HI='BarcodeDetector' in window;let idle=null;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let pvRun=false,pvN=0;const pvx=$('#pv').getContext('2d');
function pvLoop(){
  if(!pvRun)return;
  const v=$('#vid'),cv=$('#pv');
  if((pvN++&1)===0&&v.readyState>=2&&v.videoWidth){
    const dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(cv.clientWidth*dpr),ph=Math.round(cv.clientHeight*dpr);
    if(pw>0&&ph>0){if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph}
      const vw=v.videoWidth,vh=v.videoHeight,k=Math.max(pw/vw,ph/vh),dw=vw*k,dh=vh*k;pvx.drawImage(v,(pw-dw)/2,(ph-dh)/2,dw,dh)}
  }
  requestAnimationFrame(pvLoop);
}
function startPv(){if(pvRun)return;pvRun=true;pvLoop()}
function mkDet(){if(!('BarcodeDetector' in window))return null;try{return new BarcodeDetector()}catch(_){return null}}
function pickBar(r){if(!r||!r.length)return null;return r.find(x=>x.format==='code_128')||r[0]}
function stopStream(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;try{$('#vid').srcObject=null}catch(_){}}
function closeCam(){
  running=false;pvRun=false;clearTimeout(tm);
  $('#vid').classList.remove('ready');try{$('#vid').pause()}catch(_){}
  $('#cam').hidden=true;$('#cam-tools').textContent='';
  clearTimeout(idle);idle=setTimeout(stopStream,25000);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(idle);stopStream();if(!$('#cam').hidden)closeCam()}});
function loop(id){
  const v=$('#vid'),det=mkDet();
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const cv2=document.createElement('canvas'),cx2=cv2.getContext('2d',{willReadFrequently:true});
  const cv3=document.createElement('canvas'),cx3=cv3.getContext('2d');
  let c=0,slow=0,pend='',pendN=0,pendT=0;
  const confirm=(val,need)=>{const now=performance.now();if(val===pend&&now-pendT<1200)pendN++;else{pend=val;pendN=1}pendT=now;return pendN>=need?val:null};
  const step=async()=>{
    if(!running||target!==id)return;
    let text=null,nonc=null;const t0=performance.now();
    try{
      if(v.readyState>=2&&v.videoWidth){
        c++;
        const VW=v.videoWidth,VH=v.videoHeight,sy=VH*0.3,sh=VH*0.34,W=Math.min(VW,2560),hb=Math.round(sh*(W/VW));
        /* 1) pembaca bawaan browser (Android): cepat, resolusi penuh */
        if(det){try{const r=await det.detect(v);const h=pickBar(r);if(h){if(h.format==='code_128')text=h.rawValue;else nonc=h.rawValue}}catch(_){}}
        if(!text){
          cv.width=W;cv.height=hb;cx.drawImage(v,0,sy,VW,sh,0,0,W,hb);
          /* 2) pembaca Code 128 bawaan aplikasi, hanya pada pita bingkai */
          if(slow<2||c%3===0){
            const t1=performance.now();
            const r1=scanRows(grayOf(cx,0,0,W,hb),W,hb,0,hb,3);
            if(r1)text=(r1.length>=6)?r1:confirm(r1,2);
            if(!text&&VW<1600&&c%3===1){const k=2,W2=Math.round(VW*k),H2=Math.round(sh*k);cv2.width=W2;cv2.height=H2;cx2.imageSmoothingQuality='high';cx2.drawImage(v,0,sy,VW,sh,0,0,W2,H2);const r2=scanRows(grayOf(cx2,0,0,W2,H2),W2,H2,0,H2,3);if(r2)text=(r2.length>=6)?r2:confirm(r2,2)}
            const d=performance.now()-t1;slow=d>90?Math.min(slow+1,4):Math.max(slow-1,0);
          }
          /* 3) ZXing semua jenis: lebih jarang, pada gambar yang diperkecil */
          if(!text&&window.ZXing&&c%(det?4:3)===0){
            const zw=Math.min(W,1280),zh=Math.round(hb*zw/W);cv3.width=zw;cv3.height=zh;cx3.drawImage(cv,0,0,W,hb,0,0,zw,zh);
            const zt=zxCanvas(cv3);if(zt)text=(zxCanvas.fmt===ZXing.BarcodeFormat.CODE_128&&zt.length>=6)?zt:confirm(zt,3);
          }
          if(!text&&nonc)text=confirm(nonc,3);
        }
      }
    }catch(_){}
    if(text){const t=clean(text);if(t.length<4)text=null}
    if(text&&running){closeCam();deliver(id,text);return}
    const dt=performance.now()-t0;
    tm=setTimeout(step,dt>150?40:10);
  };
  step();
}
function setupTools(s){
  let zp=null;
  const box=$('#cam-tools');box.textContent='';
  const tr=s.getVideoTracks()[0];let c={};try{c=tr.getCapabilities?tr.getCapabilities():{}}catch(_){}
  const mk=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>fn(b);box.appendChild(b);return b};
  if(c.zoom&&c.zoom.max>c.zoom.min){
    const zs=[1,2,3].map(z=>Math.min(Math.max(z,c.zoom.min),c.zoom.max)).filter((z,i,a)=>a.indexOf(z)===i);
    const bs=[];
    zs.forEach(z=>bs.push(mk(z+'x',async b=>{try{await tr.applyConstraints({advanced:[{zoom:z}]});bs.forEach(x=>x.classList.remove('on'));b.classList.add('on')}catch(_){}})));
    const i=zs.includes(2)?zs.indexOf(2):zs.length-1;zp=bs[i].onclick();
  }
  if(c.torch){let on=false;mk('\u{1F4A1}',async b=>{on=!on;try{await tr.applyConstraints({advanced:[{torch:on}]});b.classList.toggle('on',on)}catch(_){on=!on}})}
  $('#pv').onclick=$('#vid').onclick=async()=>{try{if(c.focusMode&&c.focusMode.includes('single-shot')){await tr.applyConstraints({advanced:[{focusMode:'single-shot'}]});setTimeout(()=>{if(c.focusMode.includes('continuous'))tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{})},1200)}}catch(_){}};
  return zp;
}
function fitVideo(){
  if($('#cam').classList.contains('ios'))return;
  const v=$('#vid'),vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return;
  const c=$('#cam'),cw=c.clientWidth||innerWidth,ch=c.clientHeight||innerHeight,k=Math.max(cw/vw,ch/vh),st=v.style;
  st.position='absolute';st.inset='auto';st.left='50%';st.top='50%';st.maxWidth='none';st.maxHeight='none';
  st.width=Math.ceil(vw*k)+'px';st.height=Math.ceil(vh*k)+'px';st.transform='translate(-50%,-50%)';st.objectFit='cover';
}
['loadedmetadata','resize','playing'].forEach(e=>$('#vid').addEventListener(e,fitVideo));
addEventListener('resize',fitVideo);addEventListener('orientationchange',()=>setTimeout(fitVideo,250));
function reveal(){const v=$('#vid'),go=()=>{fitVideo();v.classList.add('ready')};try{if(v.requestVideoFrameCallback){v.requestVideoFrameCallback(()=>v.requestVideoFrameCallback(go))}else setTimeout(go,300)}catch(_){go()}setTimeout(go,1200)}
async function scan(id){
  target=id;clearTimeout(idle);const cam=$('#cam'),v=$('#vid'),p=$('#cam-p');
  cam.hidden=false;v.classList.remove('ready');v.hidden=false;$('#frame').hidden=false;p.textContent='Arahkan kamera ke barcode';
  let s=null;
  if(stream&&stream.getTracks().some(t=>t.readyState==='live'))s=stream;
  else try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:HI?2560:1920},height:{ideal:HI?1440:1080},frameRate:{ideal:30}},audio:false})}
  catch(e){
    if(framed){closeCam();target=id;$('#shot-in').click();return}
    v.hidden=true;$('#frame').hidden=true;
    p.textContent='Kamera tidak bisa dibuka. Izinkan akses kamera untuk situs ini di pengaturan browser, atau tutup lalu ketik manual.';return;
  }
  if(cam.hidden){if(s!==stream)s.getTracks().forEach(t=>t.stop());return}
  stream=s;v.srcObject=s;try{await v.play()}catch(e){}if(IOS){cam.classList.add('ios');startPv()}else cam.classList.remove('ios');fitVideo();let fc=0;const fi=setInterval(()=>{fitVideo();if(++fc>16||$('#cam').hidden)clearInterval(fi)},250);
  try{const tr=s.getVideoTracks()[0],c=tr.getCapabilities?tr.getCapabilities():{};
    if(c.focusMode&&c.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(_){}
  const zp=setupTools(s);running=true;loop(id);Promise.resolve(zp).catch(()=>{}).then(reveal);
}
async function readPhoto(file){
  let bm;
  try{bm=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(_){
    try{bm=await createImageBitmap(file)}catch(__){
      bm=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
    }
  }
  const W0=bm.width||bm.naturalWidth,H0=bm.height||bm.naturalHeight;
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  for(const maxS of [2000,1200]){
    const sc=Math.min(1,maxS/Math.max(W0,H0)),W=Math.round(W0*sc),H=Math.round(H0*sc);
    cv.width=W;cv.height=H;cx.drawImage(bm,0,0,W,H);
    const g=grayOf(cx,0,0,W,H);
    let t=scanRows(g,W,H,0,H,2);if(t)return t;
    const gt=new Uint8Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++)gt[x*H+y]=g[y*W+x];
    t=scanRows(gt,H,W,0,W,2);if(t)return t;
    await nap();
  }
  const det=mkDet();
  const tries=async(sx,sy,sw,sh,outW)=>{
    const sc=outW/sw;cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);
    cx.drawImage(bm,sx,sy,sw,sh,0,0,cv.width,cv.height);
    if(det){try{const r=await det.detect(cv);const h=pickBar(r);if(h)return h.rawValue}catch(_){}}
    return zxCanvas(cv);
  };
  let t=await tries(0,0,W0,H0,Math.min(W0,1600));if(t)return t;
  for(const frac of [0.5,0.3]){
    const sw=W0*frac,sh=H0*frac*0.6,stx=sw*0.5,sty=sh*0.5;
    for(let y=0;y<H0-1;y+=sty){
      for(let x=0;x<W0-1;x+=stx){t=await tries(Math.min(x,W0-sw),Math.min(y,H0-sh),sw,sh,1000);if(t)return t}
      await nap();
    }
  }
  return null;
}
$('#shot-in').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  toast('Membaca barcode\u2026',9000);
  let text=null;try{text=await readPhoto(f)}catch(_){}
  if(!text){toast('Barcode tidak terbaca. Foto lebih terang atau lebih dekat, lalu coba lagi.',3500);return}
  deliver(target,text);toast('Terbaca: '+clean(text),1800);
};
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{
  scan(b.dataset.cam);
});
$('#cam-x').onclick=closeCam;
